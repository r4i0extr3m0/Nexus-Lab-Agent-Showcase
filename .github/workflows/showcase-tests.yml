name: Nexus Agent Showcase

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  showcase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install showcase dependencies
        run: python -m pip install -r showcase/requirements.txt
      - name: Run showcase tests
        run: python -m pytest showcase/tests -q
