name: Observatory CI

on:
  push:
    branches: [main, master]
    paths:
      - 'observatory/**'
      - '.github/workflows/observatory-ci.yml'
  pull_request:
    paths:
      - 'observatory/**'
      - '.github/workflows/observatory-ci.yml'

defaults:
  run:
    working-directory: observatory

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
